<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Caçador — PokeIdle</title>
<style>
:root{--bg:#0a0c11;--bg2:#10131a;--card:#141824;--card2:#1a1f2e;--line:#242b3d;--fg:#e8ebf4;--mut:#8791ab;--acc:#7c5cff;--acc2:#22d3ee;--g:#34d399;--y:#fbbf24;--r:#f87171;--o:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 15% -10%,#1b1540 0,transparent 60%),radial-gradient(900px 400px at 100% 0,#0b2a33 0,transparent 55%),var(--bg);color:var(--fg);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:20px;box-shadow:0 6px 24px #7c5cff55}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);margin:2px 0 18px;max-width:760px}
.panel{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:14px}
textarea{width:100%;height:150px;resize:vertical;background:#0c0f17;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #7c5cff33}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
input,select{background:#0c0f17;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0;outline:none}
.go{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font:600 14px inherit;color:#fff;background:linear-gradient(135deg,var(--acc),#5b8cff);box-shadow:0 6px 20px #7c5cff44;transition:transform .08s}
button:active{transform:translateY(1px)}
button.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line);color:var(--fg)}
#info{margin-top:16px}
.me{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.me .name{font-size:18px;font-weight:700;margin-right:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--fg)}
.tag.t{border-color:#7c5cff66;background:#7c5cff1f}
.small{font-size:12px;color:var(--mut);margin-top:8px}
.summary{margin:18px 2px 8px;color:var(--mut);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:64px minmax(150px,1.3fr) minmax(210px,1.4fr) repeat(4,minmax(78px,.6fr)) minmax(120px,.8fr);gap:12px;align-items:center;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:border-color .15s,transform .15s}
.item:hover{border-color:#7c5cff88;transform:translateY(-1px)}
.lv{text-align:center;border-radius:10px;background:#0c0f17;border:1px solid var(--line);padding:6px 0}
.lv b{display:block;font-size:18px;line-height:1.1}.lv span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sp b{font-size:15px}.sp .types{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.pill{padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;background:#ffffff12;color:#cfd6ea}
.where .reg{font-weight:700;color:var(--acc2)}.where .how{font-size:12px;color:var(--mut)}
.m{font-size:12px;color:var(--mut)}.m b{display:block;font-size:14px;color:var(--fg)}
.up{color:var(--g)!important}.down{color:var(--r)!important}
.v{justify-self:end;padding:5px 11px;border-radius:999px;font-weight:700;font-size:12px;white-space:nowrap}
.v.g{background:#34d39922;color:var(--g)}.v.y{background:#fbbf2422;color:var(--y)}.v.r{background:#f8717122;color:var(--r)}.v.s{background:#fb923c22;color:var(--o)}
.thr{grid-column:2/-1;font-size:12px;color:var(--o);margin-top:-4px}
.empty{padding:28px;text-align:center;color:var(--mut)}

<header><div class="logo">🎯</div><h1>Caçador</h1></header>
<p class="sub">Cole a ficha do seu pokémon e descubra <b>onde caçar</b>: região e aba do Mapa, vantagem de tipo, tempo para matar e risco. Estimativa com a fórmula de dano da wiki.</p>

<div class="panel">
  <textarea id="ficha" placeholder="Cole aqui a ficha do PokeIdle (Espécie, Nível, HP de combate, tabela de stats...)"></textarea>
  <div class="ctl">
    <label>Hunt — nível mín.<input type="number" id="lmin" value="1" min="1"></label>
    <label>Hunt — nível máx.<input type="number" id="lmax" value="150" min="1"></label>
    <label>Nível do treinador<input type="number" id="ltr" placeholder="opcional"></label>

    <label>Ordenar por<select id="ord"><option value="rend">Rendimento estimado</option><option value="nivel">Maior nível seguro</option><option value="rapido">Mais rápido</option><option value="seguro">Mais seguro</option><option value="x4">Maior vantagem de tipo</option></select></label>
    <label>Mostrar<select id="filt"><option value="ok">Só viáveis</option><option value="todos">Todos</option><option value="x4">Só ×4</option><option value="x2">Só ≥×2</option></select></label>
  </div>
  <div class="go"><button id="go">Analisar</button><button class="ghost" id="clr">Limpar</button></div>
</div>

<div id="info" class="panel" style="display:none"></div>
<div id="res"></div>
</div>

function analyse(){
  const f=parse($('ficha').value);const info=$('info'),res=$('res');
  if(!f.dex||!f.nivel||!f.tipos||!f.tipos.length){info.style.display='';info.innerHTML='<span class="down">Não consegui ler a ficha: preciso de "Espécie: Nome (#dex) — TIPO / TIPO" e "Nível: N".</span>';res.innerHTML='';return}
  const me=D.find(s=>s[0]===f.dex);
  const base=me?me[5]:[40,40,40,40,40,40];
  const est=(b,hp)=>Math.round((b+33)*f.nivel/100*(hp?1.19:1.16));
  const S={hp:f.st.HP||est(base[0],1),atk:f.st.ATK||est(base[1]),def:f.st.DEF||est(base[2]),spa:f.st['SP.ATK']||est(base[3]),spd:f.st['SP.DEF']||est(base[4])};
  const myHP=f.hpc||Math.max(24,S.hp*12);
  const mv=me?me[6].filter(m=>m[3]<=f.nivel).map(m=>({t:m[0],p:m[1],cd:m[2],c:m[4]})):[];
  const lmin=+$('lmin').value||1,lmax=+$('lmax').value||1e9,ltr=+$('ltr').value||0,rg=$('reg').value;
  info.style.display='';
  info.innerHTML='<div class="me"><span class="name">'+esc(f.nome)+' <span class="m" style="display:inline">#'+f.dex+'</span></span>'+
    f.tipos.map(i=>'<span class="tag t">'+PT[i]+'</span>').join('')+
    '<span class="tag">Nv '+f.nivel+'</span>'+(f.shiny?'<span class="tag">✨ shiny</span>':'')+(f.pot?'<span class="tag">'+f.pot+'</span>':'')+(f.nota?'<span class="tag">nota '+esc(f.nota)+'</span>':'')+'<span class="tag">HP de combate '+myHP+'</span></div>'+
    '<div class="small">Golpes liberados: '+(mv.length?mv.map(m=>PT[m.t]+' '+m.p+' ('+(m.c==='E'?'esp.':'fís.')+', '+m.cd+'s)').join(' · '):'só a Investida')+(f.st.ATK?'':' · stats estimados (a ficha não trouxe a tabela)')+'</div>';
  const out=[];
  for(const w of D){
    const hl=w[4];if(!hl)continue;
    const R=regionOf(w[0]);
    if(rg&&R!==rg)continue;
    if(hl<lmin||hl>lmax)continue;
    if(ltr&&Math.max(hl,REGMIN[R])>ltr)continue;
    const wt=[w[2]];if(w[3]>=0)wt.push(w[3]);
    const wst=w[5].map((b,i)=>wildStat(b,hl,i===0));
    const wmv=w[6].filter(m=>m[3]<=hl).map(m=>({t:m[0],p:m[1],cd:m[2],c:m[4]}));
    const wHP=Math.max(24,wst[0]*12)*5;
    const myDps=dpsOf(f.nivel,mv,f.tipos,S.atk,S.spa,wst[2],wst[4],wt,1);
    const wDps=dpsOf(hl,wmv,wt,wst[1],wst[3],S.def,S.spd,f.tipos,1.8);
    const tKill=wHP/myDps,tDie=myHP/wDps,kpl=tDie/tKill;
    const myTypes=[...new Set([...f.tipos,...mv.map(m=>m.t)])];
    const adv=Math.max(...myTypes.map(t=>ty(t,wt)));
    const wTypes=[...new Set([...wt,...wmv.map(m=>m.t)])];
    const dan=Math.max(...wTypes.map(t=>ty(t,f.tipos)));
    out.push({hl,dex:w[0],nome:w[1],wt,R,adv,dan,tKill,tDie,kpl,wmv});
  }
  let list=out;const fl=$('filt').value;
  if(fl==='ok')list=list.filter(o=>verd(o)<2);
  if(fl==='x4')list=list.filter(o=>o.adv>=4);
  if(fl==='x2')list=list.filter(o=>o.adv>=2);
  const ord=$('ord').value;
  list.sort((a,b)=>ord==='rend'?(b.hl/(b.tKill+4)-a.hl/(a.tKill+4)):ord==='nivel'?(b.hl-a.hl||a.tKill-b.tKill):ord==='rapido'?a.tKill-b.tKill:ord==='seguro'?b.kpl-a.kpl:(b.adv-a.adv||b.kpl-a.kpl));
  const n=list.length;list=list.slice(0,60);
  let h='<div class="summary">'+n+' hunt'+(n===1?'':'s')+' na faixa '+lmin+'–'+(lmax===1e9?'∞':lmax)+(rg?' · '+rg:'')+(ltr?' · treinador Nv '+ltr:'')+(n>60?' · mostrando 60':'')+'</div>';
  if(!n)h+='<div class="panel empty">Nenhuma hunt com esses filtros. Alargue a faixa de nível ou troque "Mostrar" para <b>Todos</b>.</div>';
  else h+='<div class="list">'+list.map(o=>{
    const v=verd(o);
    const thr=[...new Set(o.wmv.filter(m=>ty(m.t,f.tipos)>=2).map(m=>PT[m.t]))].join(', ');
    const need=Math.max(o.hl,REGMIN[o.R]);
    const how=o.R==='Outland'?'Mapa → aba Outland (escolha a Outland 1–8)':'Mapa → aba '+o.R+' → busque "'+esc(o.nome)+'"';
    return '<div class="item">'+
      '<div class="lv"><b>'+o.hl+'</b><span>hunt</span></div>'+
      '<div class="sp"><b>'+esc(o.nome)+'</b> <span class="m" style="display:inline">#'+o.dex+'</span><div class="types">'+o.wt.map(i=>'<span class="pill">'+PT[i]+'</span>').join('')+'</div></div>'+
      '<div class="where"><div class="reg">📍 '+o.R+'</div><div class="how">'+how+' · treinador Nv '+need.toLocaleString('pt-BR')+'+</div></div>'+
      '<div class="m">Vantagem<b class="'+(o.adv>1?'up':o.adv<1?'down':'')+'">×'+fx(o.adv)+(o.adv>1?' → ×'+fx(amp(o.adv)):'')+'</b></div>'+
      '<div class="m">Perigo<b class="'+(o.dan>1?'down':o.dan<1?'up':'')+'">×'+fx(o.dan)+(o.dan>1?' → ×'+fx(amp(o.dan)):'')+'</b></div>'+
      '<div class="m">Matar<b>'+fx(o.tKill)+' s</b></div>'+
      '<div class="m">Abates/vida<b>'+(o.kpl>99?'99+':fx(o.kpl))+'</b></div>'+
      '<span class="v '+VC[v]+'">'+VL[v]+'</span>'+
      (thr?'<div class="thr">⚠ golpes dele que ameaçam: '+thr+'</div>':'')+'</div>'}).join('')+'</div>';
  res.innerHTML=h;
}
$('go').onclick=analyse;
$('clr').onclick=()=>{$('ficha').value='';$('info').style.display='none';$('res').innerHTML=''};
['lmin','lmax','ltr','reg','ord','filt'].forEach(i=>$(i).addEventListener('change',()=>{if($('ficha').value.trim())analyse()}));
$('ficha').addEventListener('paste',()=>setTimeout(analyse,0));
</script></body></html>
